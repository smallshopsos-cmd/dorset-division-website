<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review approvals | Dorset Division</title><style>body{font:16px system-ui;background:#091625;color:#f5f3ed;max-width:800px;margin:3rem auto;padding:1rem}button{padding:.6rem 1rem;margin:.4rem;border:0;border-radius:5px;cursor:pointer}article{border:1px solid #ad935d;padding:1.2rem;margin:1rem 0;border-radius:10px}small{color:#d9bd81}a{color:#e8cc8c}</style><h1>Review approvals</h1><p>Private area. Configure Cloudflare Access for this page and its API before use.</p><div id="items">Loading…</div><script>const items=document.querySelector('#items');async function load(){try{const r=await fetch('/api/reviews/admin');if(!r.ok)throw Error('Not authorised or database not connected');const data=await r.json();items.replaceChildren();if(!data.reviews.length)items.textContent='No pending reviews.';for(const review of data.reviews){const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),info=document.createElement('small');h.textContent=review.name+' - '+review.rating+' stars';p.textContent=review.review;info.textContent=review.email+' | '+(review.business||'No business supplied');card.append(h,p,info);for(const status of ['approved','rejected']){const b=document.createElement('button');b.textContent=status==='approved'?'Approve':'Reject';b.onclick=async()=>{b.disabled=true;const res=await fetch('/api/reviews/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:review.id,status})});if(res.ok)load();else alert('Could not update review');};card.append(b);}items.append(card);}}catch(e){items.textContent=e.message;}}load();</script></html>
