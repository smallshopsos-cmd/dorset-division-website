<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Service layout check</title><style>body{margin:0;background:#dce0e4;font:14px Arial;color:#071421}header{padding:12px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;background:white}select{padding:5px}main{padding:12px;display:flex;justify-content:center}iframe{border:0;display:block;background:#061321;width:390px;height:844px;flex:none;box-shadow:0 2px 12px #0004}</style></head><body><header><label>Page <select id="page"><option value="website-design-development">Websites</option><option value="business-strategy-research">Strategy</option><option value="ecommerce-shopify-support">Ecommerce</option><option value="branding-logo-design">Branding</option><option value="book-formatting-publishing">Publishing</option></select></label><label>Viewport <select id="width"><option value="375">Phone 375</option><option value="390" selected>Phone 390</option><option value="768">Tablet 768</option><option value="1280">Desktop 1280</option></select></label></header><main><iframe title="Service preview" src="website-design-development"></iframe></main><script>const preview=document.querySelector('iframe');document.querySelector('#page').addEventListener('change',e=>preview.src=e.target.value);document.querySelector('#width').addEventListener('change',e=>preview.style.width=e.target.value+'px');</script></body></html>
